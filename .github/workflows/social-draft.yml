name: X Draft to Slack

on:
  schedule:
    # 07:00 JST Tue–Sat (22:00 UTC Mon–Fri) — about 8 hours after the digest job,
    # so each weekday digest gets exactly one draft at a readable hour.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date (YYYY-MM-DD). Empty = latest digest.'
        required: false
        type: string
      force:
        description: 'Draft again even if this digest was already drafted'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-draft
  cancel-in-progress: false

jobs:
  draft:
    # Kill switch: set repository variable SOCIAL_ENABLED to "false" to stop drafting.
    if: ${{ vars.SOCIAL_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Compose draft and send to Slack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npm run social:draft -- $ARGS

      - name: Commit social log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-log.json
          if git diff --staged --quiet; then
            echo "No draft recorded"
          else
            git commit -m "chore(social): draft log"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
